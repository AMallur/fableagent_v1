name: Test Optum Sandbox

on:
  workflow_dispatch:
    inputs:
      token_url:
        description: "Exact sandbox token URL from the subscribed Optum product documentation"
        required: true
        type: string
      token_auth_mode:
        description: "OAuth credential placement required by that documentation"
        required: true
        type: choice
        options: [json, form, basic]
      api_base_url:
        description: "Optional exact sandbox API base URL"
        required: false
        type: string
      endpoint_path:
        description: "Optional exact sandbox resource path"
        required: false
        type: string
      test_payload:
        description: "Optional JSON body to POST to endpoint_path (sandbox test values only, no PHI)"
        required: false
        type: string

jobs:
  test-optum:
    runs-on: ubuntu-latest
    environment: testenv

    defaults:
      run:
        working-directory: engine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Optum authentication
        env:
          OPTUM_CLIENT_ID: ${{ secrets.OPTUM_CLIENT_ID }}
          OPTUM_CLIENT_SECRET: ${{ secrets.OPTUM_CLIENT_SECRET }}
          OPTUM_TOKEN_URL: ${{ inputs.token_url }}
          OPTUM_TOKEN_AUTH_MODE: ${{ inputs.token_auth_mode }}
          OPTUM_API_BASE_URL: ${{ inputs.api_base_url }}
          OPTUM_ENDPOINT_PATH: ${{ inputs.endpoint_path }}
          OPTUM_TEST_PAYLOAD: ${{ inputs.test_payload }}
        run: node scripts/optum_sandbox_explore.ts

      - name: Print raw sandbox response
        if: always()
        run: |
          for f in var/optum_sandbox/response_*.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo
          done
