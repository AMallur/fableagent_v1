name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_admin
          POSTGRES_DB: rcm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rcm_runtime:rcm_ci_password@localhost:5432/rcm
      TEST_DATABASE_URL: postgres://postgres:postgres_ci_admin@localhost:5432/rcm
      RLS_DATABASE_URL: postgres://rcm_runtime:rcm_ci_password@localhost:5432/rcm
      ADMIN_DATABASE_URL: postgres://postgres:postgres_ci_admin@localhost:5432/rcm
      PGSSLMODE: disable
      # test-only values — never used outside this ephemeral CI database
      SESSION_SECRET: ci-session-secret-not-for-production-use
      DATA_ENCRYPTION_KEY: ci-data-key-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        working-directory: engine
        run: npm ci

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Bootstrap non-superuser runtime role
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rcm_runtime LOGIN PASSWORD 'rcm_ci_password';
          CREATE ROLE rcm_app NOLOGIN;
          CREATE ROLE rcm_service NOLOGIN BYPASSRLS;
          CREATE ROLE rcm_pretenant_lookup NOLOGIN;
          CREATE ROLE rcm_catalog_lookup NOLOGIN;
          GRANT rcm_pretenant_lookup, rcm_catalog_lookup
            TO rcm_runtime WITH ADMIN OPTION, INHERIT FALSE;
          ALTER DATABASE rcm OWNER TO rcm_runtime;
          ALTER SCHEMA public OWNER TO rcm_runtime;
          SQL

      - name: Run migrations
        run: bash db/migrate.sh

      - name: Revoke migration-only owner-role memberships
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE rcm_pretenant_lookup, rcm_catalog_lookup FROM rcm_runtime;
          SQL

      - name: Seed demo data (required by several integration suites)
        working-directory: engine
        run: DATABASE_URL="$ADMIN_DATABASE_URL" npm run seed

      - name: Unit tests
        working-directory: engine
        run: npm test

      - name: Generate deterministic synthetic benchmark evidence
        working-directory: engine
        run: npm run benchmark:pilot

      - name: Upload synthetic benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pilot-benchmark-${{ github.sha }}
          path: |
            engine/var/pilot_benchmark/benchmark.json
            engine/var/pilot_benchmark/benchmark.md
          if-no-files-found: error
          retention-days: 30

      - name: Generate CMS public-data POC evidence
        working-directory: engine
        run: npm run poc:cms-public -- --engine-commit "$GITHUB_SHA"

      - name: Build CMS public-data POC evidence manifest
        working-directory: engine
        run: |
          npm run evidence:manifest -- \
            --bundle-id "cms-public-poc-${GITHUB_SHA}" \
            --engine-commit "${GITHUB_SHA}" \
            --protocol-version cms-public-poc-v1 \
            --output var/cms_public_poc/evidence-manifest.json \
            --files \
              testdata/cms_2024_public_poc_fixture.json \
              var/cms_public_poc/poc_summary.json \
              var/cms_public_poc/poc_findings.csv \
              var/cms_public_poc/poc_report.md

      - name: Upload CMS public-data POC evidence
        uses: actions/upload-artifact@v4
        with:
          name: cms-public-poc-${{ github.sha }}
          path: |
            engine/testdata/cms_2024_public_poc_fixture.json
            engine/var/cms_public_poc/poc_summary.json
            engine/var/cms_public_poc/poc_findings.csv
            engine/var/cms_public_poc/poc_report.md
            engine/var/cms_public_poc/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Smoke external assurance tooling
        working-directory: engine
        run: |
          npm run validation:external -- --input ../docs/examples/external_validation.example.json --output-dir var/external_validation_example
          mkdir -p var/assurance_smoke
          npm run evidence:manifest -- \
            --bundle-id "ci-${GITHUB_SHA}" \
            --engine-commit "${GITHUB_SHA}" \
            --protocol-version external-validation-v1 \
            --output var/assurance_smoke/evidence-manifest.json \
            --files \
              ../docs/examples/external_validation.example.json \
              ../docs/examples/external_validation.schema.json \
              var/external_validation_example/metrics.json \
              var/external_validation_example/report.md \
              var/pilot_benchmark/benchmark.json \
              var/pilot_benchmark/benchmark.md

      - name: Upload assurance tooling smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: assurance-tooling-smoke-${{ github.sha }}
          path: |
            engine/var/external_validation_example/metrics.json
            engine/var/external_validation_example/report.md
            engine/var/assurance_smoke/evidence-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Integration tests
        working-directory: engine
        run: npm run test:integration

      - name: Non-superuser RLS regression tests
        working-directory: engine
        run: npm run test:rls

      - name: Production dependency audit
        working-directory: engine
        run: npm audit --omit=dev --audit-level=high

      - name: Generate dependency security evidence
        if: always()
        working-directory: engine
        run: |
          npm audit --omit=dev --json > dependency-audit.json || true
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-evidence-${{ github.sha }}
          path: |
            engine/dependency-audit.json
            engine/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - uses: hashicorp/setup-terraform@v4

      - name: Validate AWS Terraform
        working-directory: infra/aws/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Build Docker image (smoke check)
        run: docker build --target runtime -t rcm-engine:ci ./engine

      - name: Build AWS runtime and migration images
        run: |
          docker build -f infra/aws/Dockerfile --target runtime -t fableagent-aws-runtime:ci .
          docker build -f infra/aws/Dockerfile --target migrate -t fableagent-aws-migrate:ci .
